<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoftOne Agents</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #1c2330; --muted: #677285; --line: #e2e6ec;
  --accent: #2f6fed; --accent-soft: #e8effd; --ok: #1d8a4e; --ok-soft: #e4f5ec;
  --warn: #b26b00; --warn-soft: #fdf1dc; --bad: #c2352b; --bad-soft: #fde8e6; --hl: #fff6c9;
  --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1a1f27; --text: #e4e8ef; --muted: #8d97a8; --line: #2b323d;
    --accent: #6c9cff; --accent-soft: #1f2b44; --ok: #4cc283; --ok-soft: #173326;
    --warn: #f0b250; --warn-soft: #3a2c12; --bad: #ff7b70; --bad-soft: #3d1c1a; --hl: #3b3615;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0 auto 0 0; }
header h1 span { color: var(--muted); font-weight: 400; }
select, button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft);
  color: var(--accent); white-space: nowrap; }
.badge.off { background: var(--line); color: var(--muted); }
.badge.on { background: var(--warn-soft); color: var(--warn); }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
main.nodb { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 900px) { main, main.nodb { grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(70vh, auto); }
  body { height: auto; } }
#chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
#log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
  overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-color: transparent; white-space: pre-wrap; }
.msg.error { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.msg .body > :first-child { margin-top: 0; } .msg .body > :last-child { margin-bottom: 0; }
.msg table { border-collapse: collapse; margin: 6px 0; }
.msg th, .msg td { border: 1px solid var(--line); padding: 2px 8px; text-align: left; }
.msg pre, .msg code { font-family: var(--mono); font-size: 12px; }
.msg pre { white-space: pre-wrap; background: var(--bg); padding: 8px; border-radius: 6px; }
.meta { display: flex; gap: 6px; margin-bottom: 6px; }
.box { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 12px; }
.box h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.box ul { margin: 0; padding: 0; list-style: none; font-family: var(--mono); }
.box li { padding: 1px 0; }
.st { display: inline-block; min-width: 92px; }
.st.read { color: var(--muted); } .st.ran { color: var(--ok); } .st.blocked { color: var(--warn); } .st.already_done { color: var(--muted); }
.ins { color: var(--ok); } .del { color: var(--bad); } .upd { color: var(--accent); }
.approve { display: flex; gap: 8px; margin-top: 10px; }
.approve .yes { background: var(--ok); color: #fff; border-color: var(--ok); }
.approve .no { color: var(--bad); }
#examples { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
#examples button { font-size: 12px; border-radius: 99px; color: var(--muted); }
form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
textarea { flex: 1; resize: none; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; height: 40px; }
form button { background: var(--accent); color: #fff; border-color: var(--accent); padding: 0 16px; }
#busy { padding: 0 16px 8px; color: var(--muted); font-size: 12px; display: none; }
#busy.on { display: block; }
#busy::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%;
  border: 2px solid var(--accent); border-right-color: transparent; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
#side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
#tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); }
#tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 6px 10px; }
#tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
#tabs .n { margin-left: 4px; font-size: 11px; background: var(--hl); color: var(--text); padding: 0 6px; border-radius: 99px; }
#view { flex: 1; overflow: auto; padding: 12px; }
#view table { border-collapse: collapse; width: 100%; font-size: 12px; font-family: var(--mono); }
#view th { position: sticky; top: -12px; background: var(--panel); text-align: left; color: var(--muted); font-weight: 500; }
#view th, #view td { padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
#view tr.hl td { background: var(--hl); }
#view td.chg { font-weight: 700; }
.dept { margin-bottom: 16px; } .dept h3 { margin: 0 0 6px; font-size: 13px; text-transform: capitalize; }
.tool { display: flex; gap: 8px; padding: 3px 0; font-size: 12px; border-bottom: 1px solid var(--line); }
.tool code { font-family: var(--mono); min-width: 200px; }
.tool .badge { font-size: 11px; }
.tool span:last-child { color: var(--muted); }
.empty { color: var(--muted); padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>SoftOne Agents <span>· sales / inventory / finance</span></h1>
  <label>Runtime <select id="runtime"><option value="ollama">Ollama (local)</option><option value="claude">Claude</option></select></label>
  <span id="esc" class="badge off">escalation off</span>
  <button id="new">New chat</button>
  <button id="reset" title="Recreate the mock database from its seed data and start a new chat">Reset DB</button>
</header>
<main id="main">
  <section id="chat">
    <div id="log"></div>
    <div id="busy"></div>
    <div id="examples"></div>
    <form id="form"><textarea id="input" placeholder="Ask the agents… (Enter to send)"></textarea><button>Send</button></form>
  </section>
  <section id="side">
    <nav id="tabs"></nav>
    <div id="view"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const TABLES = ["orders", "order_items", "invoices_business", "payments", "items", "customers"];
const EXAMPLES = ["Create an order for customer 47: 1x item 1001 and 2x item 1002", "List unpaid invoices for customer 47",
  "How many units of item 1002 are in stock?", "Show order 5005"];
const STATUS = { read: "read", ran: "✓ ran", blocked: "⏸ blocked", already_done: "↩ duplicate" };

let info = {}, busy = false, tab = "orders", db = {}, lastDiff = [];

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return res.json();
}

function markdown(text) {
  const d = el("div", "body");
  if (window.marked && window.DOMPurify) d.innerHTML = DOMPurify.sanitize(marked.parse(text));
  else { d.style.whiteSpace = "pre-wrap"; d.textContent = text; }  // CDN unreachable: plain text
  return d;
}

function add(node) { $("log").append(node); node.scrollIntoView({ block: "end" }); $("examples").hidden = true; return node; }
function addError(text) { return add(el("div", "msg error", text)); }

// Label ids with names from the current DB view, e.g. 1001 -> "1001 (Laptop 14 inch)".
const NAMES = { item_id: ["items", "id"], product_id: ["items", "id"], item_name_or_id: ["items", "id"],
  customer_id: ["customers", "trdr"], customer: ["customers", "trdr"] };
function named(key, v) {
  const [table, pk] = NAMES[key] || [];
  const row = table && (db[table] || []).find((r) => r[pk] == v);
  return row ? `${v} (${row.name})` : v;
}
function annotate(x) {
  if (Array.isArray(x)) return x.map(annotate);
  if (x && typeof x === "object") return Object.fromEntries(Object.entries(x).map(([k, v]) => [k, typeof v === "object" ? annotate(v) : named(k, v)]));
  return x;
}

function short(row) {
  return Object.entries(row || {}).filter(([k]) => k !== "created_at").map(([k, v]) => `${k}=${named(k, v)}`).join(" ");
}

function diffBox(diff) {
  const box = el("div", "box"); box.append(el("h4", null, "Database changes"));
  if (!diff.length) { box.append(el("div", null, "none")); return box; }
  const ul = el("ul");
  for (const c of diff) {
    const key = `${c.table} #${c.key.join("/")}`;
    if (c.op === "insert") ul.append(el("li", "ins", `+ ${key}  ${short(c.after)}`));
    else if (c.op === "delete") ul.append(el("li", "del", `− ${key}  ${short(c.before)}`));
    else for (const k of c.changed) ul.append(el("li", "upd", `~ ${key}  ${k}: ${c.before[k]} → ${c.after[k]}`));
  }
  box.append(ul); return box;
}

function traceBox(trace) {
  const box = el("div", "box"); box.append(el("h4", null, "Tool calls"));
  if (!trace.length) { box.append(el("div", null, "none")); return box; }
  const ul = el("ul");
  for (const t of trace) {
    const li = el("li"); li.append(el("span", `st ${t.status}`, STATUS[t.status] || t.status), `${t.tool}(${JSON.stringify(annotate(t.args))})`);
    ul.append(li);
  }
  box.append(ul); return box;
}

function agentMessage(r) {
  const m = el("div", "msg");
  const meta = el("div", "meta"); meta.append(el("span", "badge", r.route), el("span", "badge off", r.runtime)); m.append(meta);
  m.append(markdown(r.response));
  if (r.trace) m.append(traceBox(r.trace));
  if (r.diff) m.append(diffBox(r.diff));
  if (r.pending) {
    const row = el("div", "approve");
    const yes = el("button", "yes", "Approve"), no = el("button", "no", "Reject");
    yes.onclick = () => send("yes"); no.onclick = () => send("no");
    row.append(yes, no); m.append(row);
  }
  return m;
}

function setBusy(on) {
  busy = on;
  document.querySelectorAll("form button, .approve button, #new, #reset, #runtime").forEach((b) => (b.disabled = on));
  $("input").disabled = on;
  const b = $("busy"); clearInterval(b.timer); b.classList.toggle("on", on);
  if (on) { const t0 = Date.now(); const tick = () => (b.textContent = `Agent working… ${Math.round((Date.now() - t0) / 1000)}s`); tick(); b.timer = setInterval(tick, 1000); }
  else $("input").focus();
}

async function send(text) {
  text = text.trim(); if (!text || busy) return;
  document.querySelectorAll(".approve").forEach((a) => a.remove());  // an answer is final
  add(el("div", "msg user", text)); $("input").value = "";
  setBusy(true);
  try {
    const r = await api("/api/turn", { text });
    if (r.error && !r.response) addError(r.error); else add(agentMessage(r));
    if (r.diff) { lastDiff = r.diff; const t = r.diff.find((c) => c.op !== "delete"); if (t) tab = t.table; }
  } catch (e) { addError(`Request failed: ${e}`); }
  setBusy(false);
  await loadDb();
}

async function newChat(note) {
  setBusy(true);
  $("log").replaceChildren(); $("examples").hidden = false; lastDiff = [];
  const r = await api("/api/chat", { runtime: $("runtime").value });
  if (r.error) addError(`Could not start ${$("runtime").value}: ${r.error}`);
  else if (note) add(el("div", "msg", note));
  setBusy(false);
  await loadDb();
}

async function loadDb() { if (info.mock) { db = await api("/api/db"); render(); } else render(); }

function render() {
  const tabs = $("tabs"); tabs.replaceChildren();
  const names = info.mock ? [...TABLES, "tools"] : ["tools"];
  for (const name of names) {
    const b = el("button", name === tab ? "active" : "", name === "tools" ? "Tools" : name);
    const n = lastDiff.filter((c) => c.table === name).length;
    if (n) b.append(el("span", "n", n));
    b.onclick = () => { tab = name; render(); };
    tabs.append(b);
  }
  const view = $("view"); view.replaceChildren();
  if (tab === "tools") return renderTools(view);
  const rows = db[tab] || [];
  if (!rows.length) { view.append(el("div", "empty", "No rows")); return; }
  const changed = new Map(lastDiff.filter((c) => c.table === tab && c.after).map((c) => [JSON.stringify(c.after), c.changed]));
  const table = el("table"), head = el("tr");
  const cols = Object.keys(rows[0]);
  cols.forEach((c) => head.append(el("th", null, c)));
  table.append(head);
  for (const row of rows) {
    const tr = el("tr"), hit = changed.get(JSON.stringify(row));
    if (hit) tr.className = "hl";
    cols.forEach((c) => tr.append(el("td", hit && hit.includes(c) ? "chg" : "", row[c] ?? "")));
    table.append(tr);
  }
  view.append(table);
}

function renderTools(view) {
  view.append(el("p", "empty", "Each department can call only its own tools. Writes are blocked until you approve them."));
  for (const [dept, tools] of Object.entries(info.tools || {})) {
    const d = el("div", "dept"); d.append(el("h3", null, `${dept} (${tools.length})`));
    for (const t of tools) {
      const row = el("div", "tool");
      row.append(el("code", null, t.name), el("span", t.write ? "badge on" : "badge off", t.write ? "write" : "read"), el("span", null, t.description));
      d.append(row);
    }
    view.append(d);
  }
}

$("form").onsubmit = (e) => { e.preventDefault(); send($("input").value); };
$("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("input").value); } };
$("new").onclick = () => newChat();
$("runtime").onchange = () => newChat($("runtime").value === "claude" ? "Claude runtime: every turn is a paid API call." : null);
$("reset").onclick = async () => { setBusy(true); await api("/api/reset", {}); setBusy(false); await newChat("Database reset to seed data."); };
for (const x of EXAMPLES) { const b = el("button", null, x); b.onclick = () => send(x); $("examples").append(b); }

(async () => {
  info = await api("/api/info");
  $("runtime").value = info.runtime;
  $("esc").textContent = info.escalation ? "escalation to Claude: on" : "escalation off";
  $("esc").className = info.escalation ? "badge on" : "badge off";
  $("esc").title = info.escalation ? "ANTHROPIC_API_KEY is set: a failed Ollama tool call is rerun on Claude (paid)." : "No ANTHROPIC_API_KEY: Ollama only.";
  if (!info.mock) { $("main").classList.add("nodb"); $("reset").hidden = true; tab = "tools"; }
  await newChat();
})();
</script>
</body>
</html>
