[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "softone-agent-platform"
version = "0.1.0"
description = "Multi-agent LangGraph orchestrator over SoftOne ERP, exposed as MCP tools"
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk",
  "langchain",
  "langchain-ollama",
  "langchain-mcp-adapters",
  "langgraph",
  "mcp",
  "tomli; python_version < '3.11'",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = { find = { include = ["agent_platform*", "softone_mcp*", "softone_wrapper*", "mock_db*"] } }
py-modules = ["config"]

[tool.setuptools.package-data]
mock_db = ["schema.sql"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
# `mock_db` is a top-level package next to `tests/`; pytest needs the project
# root on sys.path so `from mock_db.mock_ws import ...` resolves.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --showlocals"
